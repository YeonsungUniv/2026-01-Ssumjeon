name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ssumjeon
            git pull origin main

            # 백엔드 빌드
            cd backend
            npm ci
            npm run build
            cd ..

            # 프론트엔드 빌드
            cd frontend
            npm ci
            npm run build
            sudo cp -r dist/. /var/www/ssumjeon/
            cd ..

            # 백엔드 재시작
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save
