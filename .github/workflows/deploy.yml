name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/app
            git reset --hard HEAD
            git pull origin main 2>&1

            # 백엔드 빌드
            cd backend
            npm install
            npm run migrate
            npm run build
            cd ..

            # 프론트엔드 빌드
            cd frontend
            npm install
            npm run build
            cd ..

            # nginx 설정 반영 (기본 설정 제거 후 교체)
            sudo rm -f /etc/nginx/conf.d/default.conf
            sudo cp ~/app/nginx.conf /etc/nginx/conf.d/ssumjeon.conf
            sudo nginx -t && sudo systemctl reload nginx

            # PM2 재시작
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save