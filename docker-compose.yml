version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ssumjeon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssumjeon
      POSTGRES_USER: ssumjeon_user
      POSTGRES_PASSWORD: ssumjeon_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ssumjeon_user -d ssumjeon']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
